name: Release vi panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags; the default shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The upstream tags are what VERSION resolves against, and a fork checkout
      # does not carry them: measured on the first run of this job, describe
      # landed on v1.22.2 (the newest upstream tag that had ever been pushed to
      # the fork) and reported v1.22.2-119-gdf82c59 for a tree already merged up
      # to v1.24.1. Fetch them before describing.
      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git 2>/dev/null || true
          git fetch --tags --quiet upstream

      # Two different names, on purpose.
      #
      # RELEASE_TAG only has to be unique per push; the CLIProxyAPI updater
      # looks for the newest release carrying a `management.html` asset and
      # never reads the tag name.
      #
      # VERSION is what the UI shows, so it has to answer "which upstream am I
      # on, and how far ahead is this fork". `git describe --match 'v[0-9]*'`
      # skips our own `vi-*` tags and resolves against the upstream release
      # tags, e.g. v1.24.1-27-g21dbbf5. Setting VERSION to the `vi-*` name was
      # why the panel could only ever report its own build date.
      - name: Set release version
        run: |
          echo "RELEASE_TAG=vi-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=$(git describe --tags --match 'v[0-9]*' --always)" >> "$GITHUB_ENV"

      - name: Build
        run: bun run build

      - name: Package management.html
        run: cp dist/index.html dist/management.html

      # Updater của CLIProxyAPI tìm asset tên đúng "management.html"
      # trong release mới nhất của repo trỏ ở panel-github-repository.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          gh release create "$TAG" dist/management.html \
            --title "Vi panel $TAG" \
            --notes "Bản build fork tiếng Việt của Management Center. Commit: ${{ github.sha }}. Server CLIProxyAPI tự kéo qua panel-github-repository."
